services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:54332:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - lab-data:/var/lib/postgresql/data
volumes:
  lab-data:
